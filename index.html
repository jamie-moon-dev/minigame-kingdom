<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ▼▼▼ 여기만 본인 Firebase 값으로 바꿔주세요 (Firebase 콘솔 → 프로젝트 설정 → 웹 앱) ▼▼▼ */
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyD5iecEuqTNPDW-1BX6fAKViPJJCCaZsCc",
  authDomain: "my-minigame-kingdom.firebaseapp.com",
  databaseURL: "https://my-minigame-kingdom-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "my-minigame-kingdom"
};
/* ▲▲▲ databaseURL 은 반드시 채워야 실시간이 됩니다 (Realtime Database 주소) ▲▲▲ */
(function(){
  var rtdb=null;
  try{ firebase.initializeApp(FIREBASE_CONFIG); rtdb=firebase.database(); }
  catch(e){ console.warn('Firebase init failed',e); rtdb=null; }

  var PEER='pr'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);

  function makeRoom(){
    if(!rtdb) return null;
    var presRef=rtdb.ref('presence'), myRef=rtdb.ref('presence/'+PEER);
    myRef.onDisconnect().remove();
    var myPresence={}, peerCbs=[], connCbs=[], lastPeers=[];
    presRef.on('value', function(snap){
      var peers=[], now=Date.now();
      snap.forEach(function(ch){
        var v=ch.val()||{};
        peers.push({peer:ch.key, by:null, isMe:ch.key===PEER, sameTab:ch.key===PEER, kind:'viewer', guest:false, presence:v, updatedAt:now});
      });
      lastPeers=peers;
      for(var i=0;i<peerCbs.length;i++){ try{ peerCbs[i]({peers:peers, joined:peers, left:[], updated:peers}); }catch(e){} }
    }, function(){});
    rtdb.ref('.info/connected').on('value', function(s){
      var c=s.val()===true;
      for(var i=0;i<connCbs.length;i++){ try{ connCbs[i](c); }catch(e){} }
    });
    // stale cleanup: remove presence entries not touched for >25s (missed disconnects)
    setInterval(function(){
      var cut=Date.now()-25000;
      presRef.once('value', function(snap){
        snap.forEach(function(ch){
          var v=ch.val()||{};
          if(v._t && v._t<cut && ch.key!==PEER){ rtdb.ref('presence/'+ch.key).remove().catch(function(){}); }
        });
      });
    }, 15000);
    return {
      presence:function(patch){
        var p={}; for(var k in patch){ p[k]=patch[k]; if(patch[k]===null){ delete myPresence[k]; } else { myPresence[k]=patch[k]; } }
        p._t=Date.now();
        return myRef.update(p).catch(function(){});
      },
      onPeers:function(cb,err){ peerCbs.push(cb); if(lastPeers.length) setTimeout(function(){ try{cb({peers:lastPeers,joined:lastPeers,left:[],updated:lastPeers})}catch(e){} },0); return function(){ var i=peerCbs.indexOf(cb); if(i>=0)peerCbs.splice(i,1); }; },
      onConnection:function(cb,err){ connCbs.push(cb); return function(){ var i=connCbs.indexOf(cb); if(i>=0)connCbs.splice(i,1); }; },
      emit:function(){ return Promise.resolve(); },
      on:function(){ return function(){}; }
    };
  }

  function docApi(path){
    var ref=rtdb.ref('kv/'+path);
    return {
      onSnapshot:function(cb,err){ ref.on('value', function(sn){ try{ cb({exists:sn.exists(), data:function(){ return sn.val(); }}); }catch(e){} }, function(e){ err&&err(e); }); return function(){ ref.off(); }; },
      set:function(o){ return ref.set(o); },
      delete:function(){ return ref.remove(); }
    };
  }
  function collApi(path){
    var ref=rtdb.ref('kv/'+path);
    return {
      onSnapshot:function(cb,err){ ref.on('value', function(sn){ var docs=[]; sn.forEach(function(c){ docs.push({id:c.key, data:function(){ return c.val(); }}); }); try{ cb({docs:docs}); }catch(e){} }, function(e){ err&&err(e); }); return function(){ ref.off(); }; }
    };
  }
  function makeDb(){ if(!rtdb) return null; return { doc:docApi, collection:collApi }; }
  function makeUser(){ return { isOwner:function(){ return Promise.resolve(false); } }; }

  var adapters={ room:makeRoom(), db:makeDb(), user:makeUser() };
  window.claude={ use:function(name){ return Promise.resolve(adapters[name]!==undefined?adapters[name]:null); } };
})();
</script>

.bomb{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 34% 30%,var(--bomb2),var(--bomb) 68%);position:relative;animation:tick 1s infinite;margin:0 auto}

@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.wheel{position:relative;width:min(100%,340px);aspect-ratio:1;margin:auto}
.wheel canvas{width:100%;height:100%;min-height:0}

canvas{width:100%;flex:1;min-height:200px;display:block}
.form{flex:1;display:flex;flex-direction:column;gap:12px;padding-block:8px;overflow-y:auto}
.field{display:flex;flex-direction:column;gap:6px}

  .desc{font-size:18px}

  .prompt{font-size:88px}

  .opts{gap:14px}.opt{height:80px;font-size:22px}
  .grid16{max-width:500px;margin-inline:auto;gap:10px}

}
.ogrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:auto;width:min(100%,460px)}

.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* drawing */
.draw{flex:1;display:flex;flex-direction:column;gap:10px;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));min-height:0;overflow-y:auto}

.paper{width:min(100%,calc(50vh*4/3));aspect-ratio:4/3;margin:0 auto;background:#ffffff;border:1px solid var(--line);border-radius:16px;overflow:hidden;touch-action:none;flex:none}
.paper canvas{width:100%;height:100%;min-height:0;display:block}
.paper.me{cursor:crosshair;box-shadow:0 0 0 3px var(--blue-weak)}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:center}
.tools button[data-c]{width:30px;height:30px;border-radius:50%;background:var(--k);border:2px solid var(--line)}
.tools button[data-c].on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--blue)}
.tools .sep{width:1px;height:24px;background:var(--line)}
.wbtn{padding:7px 12px;border-radius:10px;background:var(--fill);font-weight:600;font-size:14px}

.glog{display:flex;flex-wrap:wrap;gap:6px;min-height:28px}

.dscore{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;color:var(--sub)}
.dscore span b{color:var(--c)}
/* boards */
.board{flex:1;display:flex;flex-direction:column;gap:12px;padding-block:8px calc(16px + env(safe-area-inset-bottom,0px));min-height:0}
.turnbar{display:flex;flex-wrap:wrap;gap:8px}
.tb{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:12px;background:var(--fill);font-weight:600;font-size:14px;border:2px solid transparent}

.dots{width:min(100%,56vh);margin:auto;display:block}
.dots .hit{stroke:transparent;stroke-width:30;stroke-linecap:round}
.dots .vis{stroke:var(--line);stroke-width:7;stroke-linecap:round;stroke-dasharray:2 14}
.dots .ed.set .vis{stroke:var(--text);stroke-dasharray:none}
.dots .ed.last .vis{stroke:var(--blue)}
.dots.my .ed:not(.set){cursor:pointer}
.dots.my .ed:not(.set):hover .vis{stroke:var(--blue);stroke-dasharray:none;opacity:.6}

.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;width:min(100%,calc(50vh*7/6));margin:0 auto;background:var(--blue-weak);padding:8px;border-radius:18px}

<script>
const $=s=>document.querySelector(s);
const stage=$('#stage');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=k=>`<span class="kbd">${k}</span>`;
const go=e=>e.code==='Space'||e.code==='Enter'||e.code==='NumpadEnter';
const isEnter=e=>e.code==='Enter'||e.code==='NumpadEnter';
const digit=e=>{const m=/^(Digit|Numpad)(\d)$/.exec(e.code);return m?+m[2]:-1};
const now=()=>performance.now();
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const rid=()=>Math.random().toString(36).slice(2,10);
const LSg=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const LSs=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ini=n=>esc([...String(n||'?').trim()][0]||'?');
const PAL=[['red','빨강'],['orange','주황'],['yellow','노랑'],['green','초록'],['teal','청록'],['blue','파랑'],['purple','보라'],['pink','분홍']];
const okColor=c=>PAL.some(x=>x[0]===c)?c:'blue';
const colV=c=>`var(--c-${okColor(c)})`;
const colRaw=c=>css('--c-'+okColor(c));
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rint=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,arr)=>arr[Math.floor(r()*arr.length)];
const shuf=(r,a)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const norm=s=>String(s).replace(/[\s.,!?~'"·]/g,'').toLowerCase();
function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const CHO='ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const cho=w=>[...w].map(ch=>{const c=ch.charCodeAt(0)-0xAC00;return c>=0&&c<11172?CHO[Math.floor(c/588)]:ch}).join('');
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2000)}
const htmlCache={};const setHTML=(sel,h)=>{if(htmlCache[sel]!==h){htmlCache[sel]=h;const el=$(sel);if(el)el.innerHTML=h}};

/* sound */
let ac;
function beep(f=660,d=.08,v=.12,type='sine'){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
document.addEventListener('pointerdown',()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}},{once:true});

/* ── me ── */
let pid=LSg('arc-pid');if(!pid){pid=rid();LSs('arc-pid',pid)}
const myP={pid,name:(LSg('arc-name')||('플레이어 '+(10+Math.random()*90|0))).slice(0,10),color:okColor(LSg('arc-color')||PAL[Math.random()*PAL.length|0][0])};

/* ── room (presence only: everyone's state rides in their own presence object; the host's carries the game) ── */
let room=null,roomPeers=[],conn='connecting',firstPeersAt=0,connWhy='',roomCode='';
/* db: one shared document keeps scores, names, records and team words across sessions */
let db=null,DBD=null,dbBusy=false,dbNext=null,noAdoptUntil=0,lastScoresJs='';
async function initDb(){try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db)return;try{db.doc('board/main').onSnapshot(sn=>{DBD=sn.exists?(sn.data()||{}):{};schedule()},()=>{});
    db.collection('logs').onSnapshot(q=>{const L={};q.docs.forEach(d=>{const x=d.data();if(x&&Array.isArray(x.games))L[d.id]=x.games});LOGS=L;renderBoard()},()=>{})}catch(e){db=null}}
function dbPump(){if(dbBusy||!dbNext||!db)return;dbBusy=true;const o=dbNext;dbNext=null;db.doc('board/main').set(o).catch(()=>{}).finally(()=>{dbBusy=false;dbPump()})}
function dbWriteMain(patch){const base={...(DBD||{}),...patch};DBD=base;if(db){dbNext=base;dbPump()}}
function getRecs(){if(DBD&&DBD.records)return DBD.records;try{return JSON.parse(LSg('arc-records'))||{}}catch(e){return{}}}
function saveRecs(r){LSs('arc-records',JSON.stringify(r));dbWriteMain({records:r})}
function teamWords(){if(DBD&&Array.isArray(DBD.words))return DBD.words;try{return JSON.parse(LSg('arc-words'))||[]}catch(e){return[]}}
function saveWords(w){LSs('arc-words',JSON.stringify(w));dbWriteMain({words:w})}
/* game logs: one document per date (logs/YYYY-MM-DD) holding that day's finished games */
let LOGS={},logBusy=false,logNext=null,recHTML='';
try{LOGS=JSON.parse(LSg('arc-logs'))||{}}catch(e){LOGS={}}
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function logPump(){if(logBusy||!logNext||!db)return;logBusy=true;const o=logNext;logNext=null;db.doc('logs/'+o.d).set({games:o.list}).catch(()=>{}).finally(()=>{logBusy=false;logPump()})}
function logGame(S,res,gain){try{const d=today();const e={t:Date.now(),gid:S.gid,r:(res||[]).map(r=>{const i=info(r.pid);return{p:r.pid,n:String(r.name||i.name||'').slice(0,10),c:okColor(r.color||i.color),l:String(r.label||'').slice(0,20),g:gain[r.pid]||0}})};
  const list=[...(LOGS[d]||[]),e].slice(-400);LOGS={...LOGS,[d]:list};if(!db){const keep={};Object.keys(LOGS).sort().slice(-60).forEach(k=>keep[k]=LOGS[k]);LSs('arc-logs',JSON.stringify(keep))}else{logNext={d,list};logPump()}}catch(e){}}
const net={set(patch){for(const k in patch){if(patch[k]===null)delete myP[k];else myP[k]=patch[k]}if(room)room.presence(patch).catch(()=>{});schedule()}};
/* ── room gate: pick/create a room, optional password, or play solo ── */
let roomPwd='',roomTitle='',soloMode=false,gatePend=null,gateCreate=false;
const shareURL=()=>location.href.split('#')[0]+'#room='+encodeURIComponent(roomCode||'');
const randCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.random()*A.length|0];return s};
const hashPw=s=>{let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(36)};
function showGate(){const g=$('#gate');if(g)g.hidden=false;renderGate()}
function hideGate(){const g=$('#gate');if(g)g.hidden=true}
function syncLobby(){if(!room)return;if(roomCode&&!soloMode){const r=lobbyRooms().find(x=>x.code===roomCode);if(r){if(!roomPwd&&r.hash)roomPwd=r.hash;if(!roomTitle&&r.title)roomTitle=r.title}}
  myP.room=roomCode||'';myP.solo=soloMode?1:0;
  room.presence({pid,name:myP.name,color:myP.color,room:roomCode||'',pwd:roomPwd||'',ttl:roomTitle||'',solo:soloMode?1:0,hostf:!!(CUR&&CUR.amHost)}).catch(()=>{})}
function lobbyRooms(){const m=new Map(),seen=new Set();const add=(pr)=>{const code=pr.room;if(!code||pr.solo)return;const e=m.get(code)||{code,n:0,host:'',hash:'',title:''};e.n++;if(pr.hostf&&pr.name)e.host=String(pr.name).slice(0,10);if(pr.pwd)e.hash=pr.pwd;if(pr.ttl&&!e.title)e.title=String(pr.ttl).slice(0,20);m.set(code,e)};
  for(const q of roomPeers){if(q.kind==='agent'||q.sameTab)continue;const pr=q.presence||{};if(!pr.pid||pr.pid===pid||seen.has(pr.pid))continue;seen.add(pr.pid);add(pr)}
  if(roomCode&&!soloMode)add({room:roomCode,name:myP.name,hostf:!!(CUR&&CUR.amHost),pwd:roomPwd,ttl:roomTitle});
  return [...m.values()].map(r=>({...r,locked:!!r.hash})).sort((a,b)=>b.n-a.n||(a.code<b.code?-1:1))}
function roomInfo(code){return lobbyRooms().find(r=>r.code===code)}
function renderGate(){const g=$('#gate');if(!g||g.hidden)return;
  if(gatePend){const r=roomInfo(gatePend);setHTML('#roomlist',`<div class="pwpanel"><div class="ri1">🔒 ${esc((r&&r.title)||gatePend)} 입장</div><p class="qmsg" id="pwMsg">비밀번호를 입력하세요${r?` · ${r.n}명 참여 중`:''}</p><div class="qrow"><input id="gatePwIn" maxlength="16" autocomplete="off" placeholder="비밀번호"><button class="btn" id="gatePwGo" style="flex:none;padding:0 16px">입장</button></div></div>`);setHTML('#gateact',`<button class="gatesolo" id="gatePwCancel">← 방 목록으로</button>`);const i=$('#gatePwIn');if(i)setTimeout(()=>i.focus(),40);return}
  if(gateCreate){setHTML('#roomlist',`<div class="pwpanel"><div class="ri1">✨ 새 방 만들기</div><p class="qmsg">제목과 비밀번호는 선택이에요. 비우면 코드만 있는 열린 방이 돼요.</p><input id="gateTitleIn" maxlength="20" autocomplete="off" placeholder="방 제목 (예: 인사팀 점심내기)"><input id="gateNewPwIn" maxlength="16" autocomplete="off" placeholder="비밀번호 (선택)"><button class="btn" id="gateNewGo">방 만들기</button></div>`);setHTML('#gateact',`<button class="gatesolo" id="gateCreateCancel">← 뒤로</button>`);const i=$('#gateTitleIn');if(i)setTimeout(()=>i.focus(),40);return}
  const rooms=lobbyRooms();
  setHTML('#roomlist',rooms.length?rooms.map(r=>{const head=(r.locked?'🔒 ':'')+esc(r.title||r.code),sub=(r.title?`코드 ${esc(r.code)} · `:'')+(r.host?'방장 '+esc(r.host)+' · ':'')+r.n+'명 참여 중';return `<button class="roomitem" data-code="${esc(r.code)}"><span class="rinfo"><span class="ri1">${head}</span><span class="ri2">${sub}</span></span><span class="chev">›</span></button>`}).join(''):`<div class="roomempty">${room?'아직 열려 있는 방이 없어요.<br>새 방을 만들거나 혼자 연습해 보세요.':(conn==='connecting'?'실시간 서버에 연결하는 중이에요…':'⚠️ 실시간 연결이 안 돼요.<br>잠시 후에도 안 되면 새로고침해 주세요.<br>지금은 아래 <b>혼자 연습</b>만 가능해요.')}</div>`);
  setHTML('#gateact',`<button class="btn" id="gateNew">+ 새 방 만들기</button><button class="gatesolo" id="gateSolo">🙂 혼자 연습</button>`)}
function joinRoom(code,opts){opts=opts||{};
  code=String(code||'').trim().slice(0,16);if(!code)return;
  soloMode=!!opts.solo;roomPwd=opts.pwd?hashPw(opts.pwd):'';roomTitle=opts.title?String(opts.title).slice(0,20):'';gateCreate=false;gatePend=null;
  roomCode=code;LSs('arc-room',code);try{location.hash=soloMode?'':'room='+encodeURIComponent(code)}catch(e){}
  if(!soloMode){const r=lobbyRooms().find(x=>x.code===code);if(r){if(!roomPwd&&r.hash)roomPwd=r.hash;if(!roomTitle&&r.title)roomTitle=r.title}}
  delete myP.claim;delete myP.S;clearHostTimers();firstPeersAt=firstPeersAt||Date.now();
  syncLobby();hideGate();schedule();
}
function createRoom(){joinRoom(randCode(),{})}
function soloPlay(){joinRoom(randCode(),{solo:true})}
function pickRoom(code){const r=roomInfo(code);if(r&&r.locked){gatePend=code;renderGate();const i=$('#gatePwIn');if(i)setTimeout(()=>i.focus(),40)}else joinRoom(code)}
function switchRoom(){delete myP.claim;delete myP.S;clearHostTimers();roomCode='';roomPwd='';roomTitle='';soloMode=false;gatePend=null;gateCreate=false;try{location.hash=''}catch(e){}syncLobby();showGate();schedule()}
function wireGate(){
  const g=$('#gate');
  if(g)g.addEventListener('click',e=>{
    const item=e.target.closest('.roomitem');if(item){pickRoom(item.dataset.code);return}
    if(e.target.closest('#gateNew')){gateCreate=true;renderGate();return}
    if(e.target.closest('#gateSolo')){soloPlay();return}
    if(e.target.closest('#gateNewGo')){const t=($('#gateTitleIn')||{}).value||'',p=($('#gateNewPwIn')||{}).value||'';gateCreate=false;joinRoom(randCode(),{title:t.trim(),pwd:p.trim()});return}
    if(e.target.closest('#gateCreateCancel')){gateCreate=false;renderGate();return}
    if(e.target.closest('#gatePwGo')){const i=$('#gatePwIn'),r=roomInfo(gatePend);if(!i)return;const pw=i.value.trim();if(r&&r.hash&&hashPw(pw)!==r.hash){const m=$('#pwMsg');if(m){m.textContent='비밀번호가 틀렸어요. 다시 입력하세요.';m.style.color='var(--p1)'}i.select();return}joinRoom(gatePend,{pwd:pw});return}
    if(e.target.closest('#gatePwCancel')){gatePend=null;renderGate();return}
  });
  if(g)g.addEventListener('keydown',e=>{if(isEnter(e)){if(e.target.id==='gatePwIn'){e.preventDefault();const b=$('#gatePwGo');if(b)b.click()}else if(e.target.id==='gateTitleIn'){e.preventDefault();const n=$('#gateNewPwIn');if(n)n.focus()}else if(e.target.id==='gateNewPwIn'){e.preventDefault();const b=$('#gateNewGo');if(b)b.click()}}});
  const side=document.querySelector('.side');
  if(side)side.addEventListener('click',e=>{if(e.target.closest('#rbCopy')){const u=shareURL();if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(()=>toast('초대 링크를 복사했어요')).catch(()=>toast(u));else toast(u)}if(e.target.closest('#rbSwitch'))switchRoom()});
}
async function initRoom(){
  wireGate();
  let r=null;try{r=window.claude&&window.claude.use?await window.claude.use('room'):null}catch(e){r=null}
  if(!r){conn='solo';connWhy='unavailable';showGate();schedule();return}
  room=r;
  const dead=e=>{room=null;roomPeers=[];conn='solo';connWhy=(e&&e.code)||'error';schedule()};
  room.onPeers(ch=>{roomPeers=ch.peers;if(!firstPeersAt)firstPeersAt=Date.now();renderGate();schedule()},dead);
  if(room.onConnection)room.onConnection(c=>{if(room){conn=c?'live':'connecting';schedule()}},()=>{});else conn='live';
  room.presence({pid,name:myP.name,color:myP.color,room:'',solo:0}).catch(()=>{});
  setTimeout(()=>{if(!firstPeersAt)firstPeersAt=Date.now();if(room&&!room.onConnection&&conn==='connecting')conn='live';schedule()},2500);
  let hash='';try{const m=/room=([^&]+)/.exec(location.hash||'');if(m)hash=decodeURIComponent(m[1])}catch(e){}
  if(hash)joinRoom(hash);else{showGate();schedule()}
}
function players(){

    return `<div class="rrow ${x&&x.done?'done':''} ${p?'':'gone'}" style="--c:${colOf(r.pid)}"><span class="dot"></span><span class="rn">${esc(nameOf(r.pid))}${r.pid===pid?' (나)':''}</span><span class="rbar"><i style="width:${pct}%"></i></span><span class="rt">${!p?'나감':x?(x.done?'완료 · ':'')+esc(String(x.t||'').slice(0,24)):'준비 중'}</span></div>`}).join('');
  return rows+(CUR.amHost?`<div class="rfoot"><button class="txtbtn" id="force">기다리지 않고 결과 보기</button></div>`:'');
}
stage.addEventListener('click',e=>{
  if(e.target.closest('#force')&&CUR.amHost&&CUR.S&&CUR.S.phase==='play')finishRace(CUR.S);
  if(e.target.closest('#rAgain')&&CUR.amHost)startGame(CUR.S.gid);
  if(e.target.closest('#rHome')&&CUR.amHost)toLobby();
  if(e.target.closest('#aStop')&&CUR.amHost){setS({...CUR.S,auto:null,nextAt:null});toast('자동 진행을 멈췄어요')}
  if(e.target.closest('#aNow')&&CUR.amHost)startGame(pickRandom());
  if(e.target.closest('#rFinal')&&CUR.amHost)setS({...CUR.S,phase:'final'});
  if(e.target.closest('#fDone')&&CUR.amHost)toLobby(true);
  if(e.target.closest('#rRand')&&CUR.amHost)randomGame();
});
function raceView(S){
  const v=mkView(),g=G[S.gid],inR=S.roster.some(r=>r.pid===pid);
  stage.innerHTML=`<div class="race" id="race"></div><div class="gbody" id="gbody"></div>`;const body=$('#gbody');
  if(!inR){body.innerHTML=`<div class="tapzone mid"><h3 class="head">이번 판은<br>구경하는 중이에요</h3><p class="desc">다음 판부터 같이 할 수 있어요.</p></div>`}
  else{
    net.set({r:{k:S.k,done:false,p:0,t:'준비 중'}});
    body.innerHTML=`<div class="tapzone mid"><span class="step">${g.title}</span><h3 class="head" style="max-width:640px">${g.how}</h3><div class="big" id="cdn">3</div></div>`;
    let c=3;beep(520);const st=()=>{c--;if(c>0){$('#cdn').textContent=c;beep(520);v.later(st,900)}else{beep(1040,.15);body.innerHTML='';g.run(body,mulberry(S.seed),api)}};v.later(st,1400);
    let lastP=0,pend=null,pt=null;
    const api={d:({easy:.75,normal:1,hard:1.35})[S.diff||'normal']||1,n:b=>Math.max(2,Math.round(b*(S.len||1))),later:(f,ms)=>v.later(f,ms),alive:()=>!v.dead&&!v.fin,key:f=>{v.gk=f},
      progress(p,t){if(v.dead||v.fin)return;pend={k:S.k,done:false,p,t:String(t)};const send=()=>{pt=null;if(v.dead||v.fin||!pend)return;lastP=now();net.set({r:pend});pend=null};if(now()-lastP>120)send();else if(!pt)pt=setTimeout(send,120)},
      finish(val,label,html){if(v.dead||v.fin)return;v.fin=true;v.gk=null;clearTimeout(pt);net.set({r:{k:S.k,done:true,v:val,p:1,t:String(label).slice(0,24),label:String(label).slice(0,40)}});
        body.innerHTML=`<div class="tapzone mid"><span class="step">내 기록</span>${html}<div class="tapnote">다른 사람이 끝날 때까지 기다리는 중이에요</div></div>`;beep(880,.1)}};
  }
  v.onKey=e=>v.gk?v.gk(e):false;

  return v;
}

/* keyboard */
document.addEventListener('keydown',e=>{
  const t=e.target,inInput=t.tagName==='INPUT';
  if(inInput&&t.closest('.app, .chat'))return;
  if(!inInput&&e.code==='Slash'&&!e.repeat){e.preventDefault();openChat(true);return}
  if(e.code==='Escape'){if(!$('#ov').hidden&&CUR.amHost){e.preventDefault();toLobby(!!(CUR.S&&CUR.S.phase==='final'))}return}
  if($('#ov').hidden){if(!inInput&&e.code==='KeyR'&&!e.repeat&&CUR.amHost){e.preventDefault();randomGame()}return}
  if(inInput&&!isEnter(e))return;
  if(view&&view.onKey&&view.onKey(e)&&!e.isComposing)e.preventDefault();
});

  eyeball:{sec:1,kind:'race',pick:1,title:'눈대중',ico:'📏',desc:'선 가운데, 원 중심, 45도… 감으로 맞히기',

    run(el,rng,api){const W=600,H=360,N=api.n(5);

        if(k==='center'){const r=rint(rng,50,140);return{k,r,cx:rint(rng,r+20,W-r-20),cy:rint(rng,r+10,H-r-10),q:'원의 <b>정확한 중심</b>을 누르세요'}}
        if(k==='angle'){const t=pick(rng,[30,45,60,75]);return{k,t,q:`팔이 <b>${t}도</b>가 되는 순간 멈추세요`}}
        const w=rint(rng,140,240);return{k:'square',w,q:'<b>정사각형</b>이 되는 순간 멈추세요'}});
      let i=0,tot=0,lock=false,st=0;
      el.innerHTML=`<div class="play pad"><div class="timer"><span id="en">1 / ${N}</span><b id="et">오차 합계 0.0%</b></div><p class="desc" id="eq" style="text-align:center;font-size:clamp(17px,2.4vw,22px)"></p><div class="gamec click" id="ec"><canvas id="ecv"></canvas></div><p class="qmsg" id="em" style="text-align:center;min-height:22px"></p></div>`;
      const cv=$('#ecv'),ctx=cv.getContext('2d'),dpr=devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
      const T=()=>tasks[i],moving=()=>T().k==='angle'||T().k==='square';
      const val=()=>{const t=(now()-st)/1000,k=T().k;if(k==='angle'){const p=(t*55*api.d)%180;return p<=90?p:180-p}const w=T().w,lo=w*.35,hi=w*1.7,span=hi-lo,p=(t*span*.5*api.d)%(span*2);return lo+(p<=span?p:span*2-p)};
      let ans=null;
      function draw(){ctx.fillStyle=css('--fill');ctx.fillRect(0,0,W,H);ctx.lineCap='round';const t=T(),ink=css('--text'),ok=css('--p2'),me=colRaw(myP.color);
        if(t.k==='mid'||t.k==='third'){ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(t.x1,t.y);ctx.lineTo(t.x2,t.y);ctx.stroke();[t.x1,t.x2].forEach(x=>{ctx.beginPath();ctx.moveTo(x,t.y-16);ctx.lineTo(x,t.y+16);ctx.stroke()});
          if(ans){const gx=t.x1+(t.x2-t.x1)*t.f;ctx.strokeStyle=ok;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(gx,t.y-30);ctx.lineTo(gx,t.y+30);ctx.stroke();ctx.fillStyle=me;ctx.beginPath();ctx.arc(ans.x,t.y,9,0,Math.PI*2);ctx.fill()}}
        else if(t.k==='center'){ctx.strokeStyle=ink;ctx.lineWidth=5;ctx.beginPath();ctx.arc(t.cx,t.cy,t.r,0,Math.PI*2);ctx.stroke();
          if(ans){ctx.fillStyle=ok;ctx.beginPath();ctx.arc(t.cx,t.cy,6,0,Math.PI*2);ctx.fill();ctx.fillStyle=me;ctx.beginPath();ctx.arc(ans.x,ans.y,9,0,Math.PI*2);ctx.fill()}}
        else if(t.k==='angle'){const ox=W/2-120,oy=H-50,L=220,a=ans?ans.v:val();ctx.strokeStyle=css('--track');ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+L+30,oy);ctx.stroke();
          ctx.strokeStyle=me;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+Math.cos(a*Math.PI/180)*L,oy-Math.sin(a*Math.PI/180)*L);ctx.stroke();ctx.fillStyle=ink;ctx.beginPath();ctx.arc(ox,oy,8,0,Math.PI*2);ctx.fill();
          if(ans){ctx.strokeStyle=ok;ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+Math.cos(t.t*Math.PI/180)*L,oy-Math.sin(t.t*Math.PI/180)*L);ctx.stroke();ctx.setLineDash([])}}
        else{const w=t.w,h=ans?ans.v:val(),x=(W-w)/2,y=H-30-h;ctx.fillStyle=me;ctx.globalAlpha=.85;ctx.fillRect(x,y,w,h);ctx.globalAlpha=1;
          if(ans){ctx.strokeStyle=ok;ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.strokeRect(x,H-30-w,w,w);ctx.setLineDash([])}}}
      const show=()=>{ans=null;lock=false;st=now();$('#en').textContent=`${i+1} / ${N}`;$('#eq').innerHTML=T().q+(moving()?`<span class="ph"> · ${K('Space')} 또는 클릭</span>`:'');$('#em').textContent='';api.progress(i/N,`오차 ${tot.toFixed(1)}%`);draw()};

        $('#em').innerHTML=`<b style="color:${err<3?'var(--p2)':err<10?'var(--blue)':'var(--p1)'}">${err<1.5?'완벽해요!':err<5?'아주 좋아요':err<12?'괜찮아요':'아쉬워요'}</b> 오차 ${err.toFixed(1)}%${t.k==='angle'?` (${ans.v.toFixed(1)}도)`:''}`;beep(err<3?1100:err<10?750:300,.1,.1);
        api.later(()=>{i++;if(i>=N)api.finish(tot,`오차 ${tot.toFixed(1)}%`,`<div class="big">${tot.toFixed(1)}<small>%</small></div><p class="desc">${N}문제 오차 합계 · 작을수록 좋아요</p>`);else show()},1300)};
      cv.addEventListener('pointerdown',e=>{e.preventDefault();const b=cv.getBoundingClientRect();answer({x:(e.clientX-b.left)/b.width*W,y:(e.clientY-b.top)/b.height*H})});
      api.key(e=>{if(go(e)&&moving()){if(!e.repeat)answer({});return true}return false});
      function loop(){if(!api.alive())return;if(!lock&&moving())draw();requestAnimationFrame(loop)}
      show();draw();loop()}},

  match2:{sec:3,kind:'host',min:2,title:'짝 맞추기',ico:'🃏',desc:'번갈아 카드 뒤집어 같은 그림 찾기 · 2~3인',

  bingo:{sec:3,kind:'host',min:2,title:'빙고',ico:'🎱',desc:'숫자가 불리면 내 판에 자동 체크, 먼저 한 줄!',

  land:{sec:3,kind:'host',min:2,title:'땅따먹기',ico:'🟦',desc:'내 땅에 붙은 빈 칸을 넓혀 더 많이 차지하기 · 2~3인',
    init(S){const R=6,C=6,N=R*C;S.R=R;S.C=C;S.order=S.roster.map(x=>x.pid).sort(()=>Math.random()-.5);
      const own=Array(N).fill(-1),starts=[0,N-1,C-1,N-C,12,23];S.order.forEach((p,k)=>{let s=starts[k];if(s==null||own[s]!==-1){do{s=Math.floor(Math.random()*N)}while(own[s]!==-1)}own[s]=k});

      if(!S.order.some(p=>findP(p)&&can(idxOf(p)))){endGame();return}

      if(!tp||!can(myk)){const t=nextTurn(S.turn);if(t)setS({...S,turn:t,tn:S.tn+1});else endGame();return}

$('#games').innerHTML=`<section class="section newsec"><h2>✨ NEW <small>새로 들어온 게임</small></h2><div class="items">${NEWG.map(id=>[id,G[id]]).filter(([,g])=>g).map(cardHTML).join('')}</div></section>`+SECS.map(([n,note],si)=>`<section class="section"><h2>${n} <small>${note}</small></h2><div class="items">${Object.entries(G).filter(([,g])=>g.sec===si).map(cardHTML).join('')}</div></section>`).join('');
$('#games').addEventListener('click',e=>{const b=e.target.closest('.item[data-g]');if(!b)return;if(!CUR.amHost){toast(CUR.H?`게임은 방장 ${CUR.H.pr.name}님이 시작해요`:'방장을 정하는 중이에요');return}startGame(b.dataset.g)});

$('#plist').addEventListener('click',e=>{const b=e.target.closest('.kickb');if(!b||!CUR.amHost||!CUR.S)return;const k=b.dataset.k,list=kicked();
  if(list.includes(k)){setS({...CUR.S,kick:list.filter(x=>x!==k)});toast(`${nameOf(k)}님을 들여보냈어요`);kickArm=null;return}
  if(kickArm!==k){kickArm=k;delete htmlCache['#plist'];schedule();setTimeout(()=>{if(kickArm===k){kickArm=null;delete htmlCache['#plist'];schedule()}},3000);return}
  kickArm=null;setS({...CUR.S,kick:[...list,k]});toast(`${nameOf(k)}님을 내보냈어요`)});

/* ── scoreboard ── */
let bdTab='log';
$('#bdTabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;bdTab=b.dataset.t;$('#bdTabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));renderBoard()});
$('#fDate').addEventListener('change',renderBoard);
$('#bdReset').addEventListener('click',e=>{const b=e.target.closest('button[data-rs]');if(!b||!CUR.amHost)return;const k=b.dataset.rs;
  if(bdArm!==k){bdArm=k;renderBoard();setTimeout(()=>{if(bdArm===k){bdArm=null;renderBoard()}},3000);return}bdArm=null;
  if(k==='rec'){saveRecs({});toast('최고 기록을 지웠어요')}
  else{const ds=k==='today'?[today()]:Object.keys(LOGS);const L={...LOGS};ds.forEach(d=>{delete L[d];if(db)db.doc('logs/'+d).delete().catch(()=>{})});LOGS=L;LSs('arc-logs',JSON.stringify(L));toast(k==='today'?'오늘 기록을 지웠어요':'판 기록을 모두 지웠어요')}
  renderBoard();schedule()});$('#fGame').addEventListener('change',renderBoard);
const fmtDate=d=>{const[y,m,dd]=d.split('-');return d===today()?`오늘 (${+m}월 ${+dd}일)`:`${+m}월 ${+dd}일`};
let optSig='';
let bdArm=null;
function renderBoard(){
  setHTML('#bdReset',CUR.amHost?`<span>기록 지우기 (방장만)</span><span style="display:flex;gap:4px;flex-wrap:wrap">${[['today','오늘 기록'],['all','전체 판 기록'],['rec','최고 기록']].map(([k,l])=>`<button class="txtbtn" data-rs="${k}" style="color:var(--p1);font-size:13px">${bdArm===k?'한 번 더 누르면 지워요':l}</button>`).join('')}</span>`:'');
  $('#bdFil').hidden=bdTab!=='log';
  if(bdTab==='rec'){setHTML('#bdBody',recHTML);return}
  const dates=Object.keys(LOGS).filter(d=>LOGS[d]&&LOGS[d].length).sort().reverse();
  const games=[...new Set(dates.flatMap(d=>LOGS[d].map(g=>g.gid)))].filter(k=>G[k]);
  const sig=dates.join()+'|'+games.join();
  if(sig!==optSig){optSig=sig;const fd=$('#fDate'),fg=$('#fGame'),vd=fd.value,vg=fg.value;
    const ds=dates.includes(today())?dates:[today(),...dates];
    fd.innerHTML=`<option value="all">전체 기간</option>`+ds.map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('');
    fg.innerHTML=`<option value="all">전체 게임</option>`+games.map(k=>`<option value="${k}">${G[k].title}</option>`).join('');
    fd.value=vd&&[...fd.options].some(o=>o.value===vd)?vd:today();fg.value=vg&&[...fg.options].some(o=>o.value===vg)?vg:'all'}
  const vd=$('#fDate').value,vg=$('#fGame').value;
  const list=(vd==='all'?dates.flatMap(d=>LOGS[d]):(LOGS[vd]||[])).filter(g=>vg==='all'||g.gid===vg).sort((a,b)=>b.t-a.t);
  if(!list.length){setHTML('#bdBody',`<p class="recempty">${vd==='all'?'아직 기록된 게임이 없어요.':`${fmtDate(vd)}에 한 게임이 없어요.`} 게임을 끝내면 여기에 쌓여요.</p>`);return}
  const agg={};
  for(const g of list){const mx=Math.max(0,...g.r.map(x=>x.g||0));for(const x of g.r){const a=agg[x.p]||(agg[x.p]={p:x.p,n:x.n,c:x.c,pt:0,pl:0,w:0});a.n=x.n||a.n;a.c=x.c||a.c;a.pt+=x.g||0;a.pl++;if(mx>0&&x.g===mx)a.w++}}
  const rows=Object.values(agg).sort((a,b)=>b.pt-a.pt||b.w-a.w);
  let rank=0;const table=`<div class="bdwrap"><table class="bdt"><thead><tr><th>순위</th><th>이름</th><th>점수</th><th>판수</th><th>1등</th></tr></thead><tbody>${rows.map((r,i)=>{if(i===0||r.pt!==rows[i-1].pt)rank=i+1;return `<tr class="${rank===1?'top':''}" style="--c:${colV(r.c)}"><td>${rank}</td><td><b>${esc(r.n)}</b>${r.p===pid?' (나)':''}</td><td class="pt">${r.pt}</td><td>${r.pl}</td><td>${r.w}</td></tr>`}).join('')}</tbody></table></div>`;
  const hm=t=>{const d=new Date(t);return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
  const logs=list.slice(0,25).map(g=>{const mx=Math.max(0,...g.r.map(x=>x.g||0));const w=g.r.filter(x=>mx>0&&x.g===mx);const lose=g.r.filter(x=>x.g===0&&mx>0&&g.r.length>1&&g.r.every(y=>y===x||y.g>0));
    return `<div class="gl2"><time>${vd==='all'?`${new Date(g.t).getMonth()+1}/${new Date(g.t).getDate()}`:hm(g.t)}</time><b>${esc((G[g.gid]||{}).title||g.gid)}</b><span>${w.length?w.map(x=>`<b style="--c:${colV(x.c)}">${esc(x.n)}</b> +${x.g}`).join(', '):'승자 없음'}${w.length===1&&w[0].l?` · ${esc(w[0].l)}`:''}</span></div>`}).join('');
  setHTML('#bdBody',table+`<div class="glog2"><h3>${list.length}판 기록${list.length>25?' · 최근 25판':''}</h3>${logs}</div>`);
}

$('#hostPanel').addEventListener('click',e=>{if(!CUR.amHost||!CUR.S)return;const S=CUR.S,b=e.target.closest('button');if(!b)return;
  if(b.dataset.new){setS({...S,newOnly:b.dataset.new==='1'});toast(b.dataset.new==='1'?'이제 랜덤에 NEW 게임만 나와요':'이제 랜덤에 모든 게임이 나와요')}
  else if(b.dataset.diff){setS({...S,diff:b.dataset.diff})}
  else if(b.dataset.len){setS({...S,len:+b.dataset.len})}
  else if(b.dataset.m){setS({...S,match:{n:+b.dataset.m,done:0,mp:{},over:false}});toast(`커피 당번 ${b.dataset.m}판 매치 시작! 매치 점수가 제일 낮은 사람이 당번이에요`)}
  else if(b.dataset.auto){startAuto(+b.dataset.auto)}
  else if(b.id==='mStop'){setS({...S,match:null});toast('매치를 그만했어요')}
  else if(b.id==='mFinal'){setS({...S,phase:'final',gid:'tap'})}
  else if(b.id==='wordAdd')addWord();
  else if(b.dataset.rw!=null){const w=teamWords().slice();w.splice(+b.dataset.rw,1);saveWords(w);schedule()}});
function addWord(){const i=$('#wordIn'),w=i.value.trim().slice(0,8);if(!w)return;const list=teamWords();if(!list.includes(w))saveWords([...list,w].slice(-60));i.value='';toast(`"${w}" 단어를 넣었어요`);schedule()}
$('#wordIn').addEventListener('keydown',e=>{if(isEnter(e)&&!e.isComposing){e.preventDefault();addWord()}});

/* ── chat + reactions (each person's last few messages ride in their presence) ── */
const chatLog=[],chatSeen=new Set(),bootAt=Date.now();let unread=0,chatOpen=false,peekT;
const RX=['👏','😂','😱','🔥','👍','😭'];
$('#rxbar').innerHTML=RX.map((x,i)=>`<button data-x="${i}" aria-label="리액션 ${x}">${x}</button>`).join('');
let rxLast=0;$('#rxbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b||Date.now()-rxLast<350)return;rxLast=Date.now();net.set({rx:{i:rid().slice(0,5),e:+b.dataset.x}});floatRx(+b.dataset.x,myP.name,myP.color)});
function floatRx(i,name,color){const d=document.createElement('div');d.className='rxfloat';d.style.left=(15+Math.random()*70)+'vw';d.style.bottom='110px';d.style.setProperty('--c',colV(color));d.innerHTML=`${RX[i]||'👏'}<small>${esc(name)}</small>`;document.body.appendChild(d);setTimeout(()=>d.remove(),2500)}
const rxSeen=new Map();
function openChat(focus){chatOpen=true;$('#cp').hidden=false;$('#cpeek').hidden=true;unread=0;$('#cbadge').hidden=true;const l=$('#clog');l.scrollTop=l.scrollHeight;if(focus)$('#cin').focus()}
function closeChat(){chatOpen=false;$('#cp').hidden=true;$('#cin').blur()}
$('#cbtn').onclick=()=>chatOpen?closeChat():openChat(true);
$('#cclose').onclick=closeChat;$('#cpeek').onclick=()=>openChat(true);
$('#cin').addEventListener('keydown',e=>{if(e.code==='Escape'){e.preventDefault();closeChat()}});
$('#cform').addEventListener('submit',e=>{e.preventDefault();if(kicked().includes(pid))return;const inp=$('#cin');const m=inp.value.trim().slice(0,120);if(!m)return;net.set({chat:[...(Array.isArray(myP.chat)?myP.chat:[]),{i:rid().slice(0,6),m}].slice(-6)});inp.value='';inp.focus()});
function ingestChat(ps){let fresh=null,added=0;
  for(const p of ps){if(kicked().includes(p.pr.pid)&&!p.me)continue;if(!p.me){const x=p.pr.rx,id=x&&x.i||null;if(!rxSeen.has(p.pr.pid))rxSeen.set(p.pr.pid,id);else if(id&&rxSeen.get(p.pr.pid)!==id){rxSeen.set(p.pr.pid,id);floatRx(x.e|0,p.pr.name,p.pr.color)}}
    const list=p.pr.chat;if(!Array.isArray(list))continue;
    for(const c of list){if(!c||typeof c.m!=='string')continue;const key=p.pr.pid+':'+c.i;if(chatSeen.has(key))continue;chatSeen.add(key);
      chatLog.push({me:p.me,name:String(p.pr.name||'누군가').slice(0,10),color:okColor(p.pr.color),m:c.m.slice(0,120)});added++;if(!p.me)fresh=chatLog[chatLog.length-1]}}
  if(!added)return;if(chatLog.length>150)chatLog.splice(0,chatLog.length-150);
  const l=$('#clog'),atBottom=l.scrollHeight-l.scrollTop-l.clientHeight<40;
  l.innerHTML=chatLog.map(x=>`<div class="cmsg ${x.me?'me':''}" style="--c:${colV(x.color)}">${x.me?'':`<span class="cn">${esc(x.name)}</span>`}<span class="cb">${esc(x.m)}</span></div>`).join('');
  if(atBottom||!fresh)l.scrollTop=l.scrollHeight;
  if(fresh&&!chatOpen){unread++;$('#cbadge').hidden=false;$('#cbadge').textContent=unread>9?'9+':unread;
    if(Date.now()-bootAt>2500){const pk=$('#cpeek');pk.style.setProperty('--c',colV(fresh.color));pk.innerHTML=`<b>${esc(fresh.name)}</b> ${esc(fresh.m)}`;pk.hidden=false;clearTimeout(peekT);peekT=setTimeout(()=>pk.hidden=true,3500);beep(990,.05,.06)}}
}

setInterval(schedule,1000);
/* the page's owner always hosts when present */
async function initUser(){try{const u=window.claude&&window.claude.use?await window.claude.use('user'):null;if(u&&await u.isOwner())net.set({own:1,claim:Date.now()})}catch(e){}}
schedule();initRoom();initDb();initUser();
</script>
